[package]
name = "fresnel"
version = "0.1.5"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "fresnel"
crate-type = ["cdylib", "rlib"]

[dependencies]
numpy = "0.29.0"
pyo3 = { version = "0.29.0", features = ["abi3-py38", "experimental-inspect"] }
rayon = "1.12.0"
rustfft = "6.4.1"
transpose = "0.2.3"

[profile.release]
debug = true
